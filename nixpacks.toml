# Railway/Nixpacks: this monorepo uses npm (package-lock.json), not pnpm.
[variables]
NIXPACKS_NODE_PACKAGE_MANAGER = "npm"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

# API runs via tsx — no compile step required for deploy.
[phases.build]
cmds = ["npm install"]

[start]
cmd = "npm run start:api"
